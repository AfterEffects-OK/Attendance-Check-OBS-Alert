<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出席通知オーバーレイ（背景透明・左下）</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
            overflow: hidden;
            /* 画面全体の高さを確保し、要素を左下に配置 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下寄せ */
            align-items: flex-start;    /* 左寄せ */
            box-sizing: border-box;
        }

        #notification-container {
            display: flex;
            flex-direction: column-reverse; /* 新しい通知を下から上へ積み上げる */
            gap: 12px;
            align-items: flex-start;
        }

        .notification-card {
            /* 背景を完全に透明に設定 */
            background: transparent;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 4px;
            
            /* 背景はないため影を文字の視認性（ドロップシャドウ）代わりに適用 */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 
                         -2px -2px 4px rgba(0, 0, 0, 0.8),
                         2px -2px 4px rgba(0, 0, 0, 0.8),
                         -2px 2px 4px rgba(0, 0, 0, 0.8);

            border-left: 8px solid #3b82f6; /* 左側の青いアクセントライン */
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateX(-30px);
            animation: slideIn 0.4s ease forwards, fadeOut 0.4s ease 4.6s forwards;
            white-space: nowrap;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(-10px);
            }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <script>
        // 設定済みのGASウェブアプリのURL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPg8qswqVyNpWrL0gUX2DVh2uUJP6VUrk2VwqhSqn0rWjdci_KiYTBw4JFvLXQjU-8/exec';
        
        const POLL_INTERVAL = 3000;
        let lastRowCount = -1;

        async function checkNewAttendance() {
            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const data = await response.json();
                
                , if (data && data.success) {
                    const currentRowCount = data.rowCount;
                    const latestRecord = data.latestRecord;

                    if (lastRowCount === -1) {
                        lastRowCount = currentRowCount;
                    } else if (currentRowCount > lastRowCount) {
                        lastRowCount = currentRowCount;
                        if (latestRecord && latestRecord.time && latestRecord.name) {
                            showNotification(latestRecord.time, latestRecord.name);
                        }
                    }
                }
            } catch (error) {
                console.error('出席データの取得に失敗しました:', error);
            }
        }

        function showNotification(timestampStr, name) {
            const container = document.getElementById('notification-container');

            let timeText = timestampStr;
            const timeMatch = timestampStr.match(/(\d{1,2}):(\d{2}):(\d{2})/);
            if (timeMatch) {
                timeText = `${timeMatch[1]}時${timeMatch[2]}分${timeMatch[3]}秒`;
            }

            const card = document.createElement('div');
            card.className = 'notification-card';
            card.textContent = `${timeText} ${name}さんが出席登録しました`;

            container.appendChild(card);

            setTimeout(() => {
                card.remove();
            }, 5000);
        }

        setInterval(checkNewAttendance, POLL_INTERVAL);
    </script>
</body>
</html>
