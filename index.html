<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出席通知オーバーレイ（薄い黄色・太字版）</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下寄せ */
            align-items: flex-start;    /* 左寄せ */
            box-sizing: border-box;
        }

        #notification-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .notification-card {
            /* 薄い黄色背景 ＆ 黒文字（シャドウ・エッジなし） */
            background: #ffdfdf;
            color: #111827;
            
            /* 上下のパディングを詰めたスリムな設計 */
            padding: 4px 20px;
            border-radius: 0px 50px 0px 50px;
            
            /* シャドウやエッジは完全に排除し、アクセントの左線をオレンジ */
            box-shadow: none;
            border-left: 10px solid #f97316;
            border-bottom: 4px solid #f97316;
            
            font-size: 42px;
            /* 文字が細く見えないよう、ウェイトを「900（極太）」に強化 */
            font-weight: 800;
            letter-spacing: 0.5px;
            
            /* 最初は完全に透明 ＆ 左に20pxずらしておく */
            opacity: 0;
            transform: translateX(-40px);
            
            white-space: nowrap;
            /* スムーズなGPU描画のヒント */
            will-change: opacity, transform;
        }

        /* .showが付与されたら、左からスライドしつつフェードイン */
        .notification-card.show {
            animation: slideInFromLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* .hideが付与されたら、左へ消えつつフェードアウト */
        .notification-card.hide {
            animation: fadeOutToLeft 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes slideInFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOutToLeft {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(40px);
            }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <script>
    // 設定済みのGASウェブアプリのURL
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPg8qswqVyNpWrL0gUX2DVh2uUJP6VUrk2VwqhSqn0rWjdci_KiYTBw4JFvLXQjU-8/exec';
    
    const POLL_INTERVAL = 3000; // 3秒ごとにチェック
    
    // 出席用・公欠用の状態管理
    let lastAttendanceRowCount = -1;
    let lastAbsenceRowCount = -1;
    
    let notificationQueue = [];
    let isProcessingQueue = false;
    
    // 定期実行の監視ループ
    async function checkNewData() {
      await checkNewAttendance();
      await checkNewAbsence();
    }
    
    // 1. 出席データのチェック
    async function checkNewAttendance() {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const data = await response.json();
        if (data && data.success) {
          const currentRowCount = data.rowCount;
          const recentRecords = data.recentRecords || [];
          if (lastAttendanceRowCount === -1) {
            lastAttendanceRowCount = currentRowCount;
          } else if (currentRowCount > lastAttendanceRowCount) {
            const addedCount = currentRowCount - lastAttendanceRowCount;
            lastAttendanceRowCount = currentRowCount;
            
            const newRecords = recentRecords.slice(-addedCount);
            // 出席データであることを識別するプロパティを付与
            newRecords.forEach(rec => rec.type = 'attendance');
            notificationQueue.push(...newRecords);
            
            processQueue();
          }
        }
      } catch (error) {
        console.error('出席データの取得に失敗しました:', error);
      }
    }
    
    // 2. 公欠データのチェック（?type=absence を付与）
    async function checkNewAbsence() {
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?type=absence`);
        const data = await response.json();
        if (data && data.success) {
          const currentRowCount = data.rowCount;
          const recentRecords = data.recentRecords || [];
          if (lastAbsenceRowCount === -1) {
            lastAbsenceRowCount = currentRowCount;
          } else if (currentRowCount > lastAbsenceRowCount) {
            const addedCount = currentRowCount - lastAbsenceRowCount;
            lastAbsenceRowCount = currentRowCount;
            
            const newRecords = recentRecords.slice(-addedCount);
            // 公欠データであることを識別するプロパティを付与
            newRecords.forEach(rec => rec.type = 'absence');
            notificationQueue.push(...newRecords);
            
            processQueue();
          }
        }
      } catch (error) {
        console.error('公欠データの取得に失敗しました:', error);
      }
    }
    
    // キューに入った通知を順番に処理する関数
    function processQueue() {
      if (isProcessingQueue || notificationQueue.length === 0) return;
      isProcessingQueue = true;
      
      const record = notificationQueue.shift();
      if (record) {
        showNotification(record);
      }
      
      setTimeout(() => {
        isProcessingQueue = false;
        processQueue();
      }, 500);
    }
    
    function showNotification(record) {
      const container = document.getElementById('notification-container');
      const card = document.createElement('div');
      card.className = 'notification-card';
    
      // 公欠データの場合
      if (record.type === 'absence') {
        card.textContent = `${record.name}さんの公欠を登録しました`;
      } 
      // 出席データの場合
      else {
        let timeText = record.time || '';
        const timeMatch = timeText.match(/(\d{1,2}):(\d{2}):(\d{2})/);
        if (timeMatch) {
          timeText = `${timeMatch[1]}時${timeMatch[2]}分${timeMatch[3]}秒`;
        }
    
        const report = record.report || '';
        const isAbsent = report.includes('欠席処理');
        const isProxy = report.includes('教師が代わって登録しました');
    
        if (isAbsent) {
          card.textContent = `${record.name}さんの欠席を登録しました`;
        } else if (isProxy) {
          card.textContent = `${timeText} ${record.name}さんの出席を代理登録しました`;
        } else {
          card.textContent = `${timeText} ${record.name}さんが出席登録しました`;
        }
      }
    
      container.appendChild(card);
    
      // 1. レコード追加から【5秒後】に左からのスライドイン（.show）を開始
      setTimeout(() => {
        card.classList.add('show');
      }, 5000);
    
      // 2. 表示開始から【30秒間】表示させた後、フェードアウトして削除
      setTimeout(() => {
        card.classList.remove('show');
        card.classList.add('hide');
        setTimeout(() => {
          card.remove();
        }, 500);
      }, 5000 + 30000);
    }
    
    // 定期ポーリング開始
    setInterval(checkNewData, POLL_INTERVAL);
    </script>
</body>
</html>
