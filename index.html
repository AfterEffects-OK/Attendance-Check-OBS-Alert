<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出席通知オーバーレイ（薄い黄色・太字版）</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下寄せ */
            align-items: flex-start;    /* 左寄せ */
            box-sizing: border-box;
        }

        #notification-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .notification-card {
            /* 薄い黄色背景 ＆ 黒文字（シャドウ・エッジなし） */
            background: #ffffdd;
            color: #111827;
            
            /* 上下のパディングを詰めたスリムな設計 */
            padding: 4px 20px;
            border-radius: 4px;
            
            /* シャドウやエッジは完全に排除し、アクセントの左線だけ残す */
            box-shadow: none;
            border-left: 8px solid #ca8a04;
            
            font-size: 42px;
            /* 文字が細く見えないよう、ウェイトを「900（極太）」に強化 */
            font-weight: 800;
            letter-spacing: 0.5px;
            
            opacity: 0;
            transform: translateY(20px);
            
            /* スムーズなGPU描画アニメーション */
            animation: slideUp 0.3s ease-out forwards, fadeOut 0.3s ease-in 4.7s forwards;
            white-space: nowrap;
            will-change: opacity, transform;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <script>
        // 設定済みのGASウェブアプリのURL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPg8qswqVyNpWrL0gUX2DVh2uUJP6VUrk2VwqhSqn0rWjdci_KiYTBw4JFvLXQjU-8/exec';
        
        const POLL_INTERVAL = 3000;
        let lastRowCount = -1;

        async function checkNewAttendance() {
            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const data = await response.json();
                
                if (data && data.success) {
                    const currentRowCount = data.rowCount;
                    const latestRecord = data.latestRecord;

                    if (lastRowCount === -1) {
                        lastRowCount = currentRowCount;
                    } else if (currentRowCount > lastRowCount) {
                        lastRowCount = currentRowCount;
                        if (latestRecord && latestRecord.time && latestRecord.name) {
                            showNotification(latestRecord.time, latestRecord.name);
                        }
                    }
                }
            } catch (error) {
                console.error('出席データの取得に失敗しました:', error);
            }
        }

        function showNotification(timestampStr, name) {
            const container = document.getElementById('notification-container');

            let timeText = timestampStr;
            const timeMatch = timestampStr.match(/(\d{1,2}):(\d{2}):(\d{2})/);
            if (timeMatch) {
                timeText = `${timeMatch[1]}時${timeMatch[2]}分${timeMatch[3]}秒`;
            }

            const card = document.createElement('div');
            card.className = 'notification-card';
            card.textContent = `${timeText} ${name}さんが出席登録しました`;

            container.appendChild(card);

            setTimeout(() => {
                card.remove();
            }, 5000);
        }

        setInterval(checkNewAttendance, POLL_INTERVAL);
    </script>
</body>
</html>
