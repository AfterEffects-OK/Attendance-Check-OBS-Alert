<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出席通知オーバーレイ（薄い背景付き・左下）</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
            overflow: hidden;
            /* 画面全体の高さを確保し、要素を左下に配置 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下寄せ */
            align-items: flex-start;    /* 左寄せ */
            box-sizing: border-box;
        }

        #notification-container {
            display: flex;
            flex-direction: column; /* 上から古い順に並び、新しいカードが下にどんどん追加される */
            gap: 16px;
            align-items: flex-start;
        }

        .notification-card {
            /* 薄い半透明の黒い背景を適用（背景が少し透ける上品なデザイン） */
            background: rgba(15, 23, 42, 0.65);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 6px;
            
            /* わずかに影をつけて立体感を出す */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px); /* 背面の映像を少しぼかす効果 */

            border-left: 10px solid #3b82f6; /* 左側の青いアクセントライン */
            font-size: 42px;                  /* 大きな文字サイズ */
            font-weight: bold;
            letter-spacing: 0.5px;
            
            opacity: 0;
            /* 下からニュッと浮かび上がるアニメーション */
            transform: translateY(30px);
            animation: slideUp 0.4s ease forwards, fadeOut 0.4s ease 4.6s forwards;
            white-space: nowrap;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <script>
        // 設定済みのGASウェブアプリのURL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPg8qswqVyNpWrL0gUX2DVh2uUJP6VUrk2VwqhSqn0rWjdci_KiYTBw4JFvLXQjU-8/exec';
        
        const POLL_INTERVAL = 3000;
        let lastRowCount = -1;

        async function checkNewAttendance() {
            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const data = await response.json();
                
                if (data && data.success) {
                    const currentRowCount = data.rowCount;
                    const latestRecord = data.latestRecord;

                    if (lastRowCount === -1) {
                        lastRowCount = currentRowCount;
                    } else if (currentRowCount > lastRowCount) {
                        lastRowCount = currentRowCount;
                        if (latestRecord && latestRecord.time && latestRecord.name) {
                            showNotification(latestRecord.time, latestRecord.name);
                        }
                    }
                }
            } catch (error) {
                console.error('出席データの取得に失敗しました:', error);
            }
        }

        function showNotification(timestampStr, name) {
            const container = document.getElementById('notification-container');

            let timeText = timestampStr;
            const timeMatch = timestampStr.match(/(\d{1,2}):(\d{2}):(\d{2})/);
            if (timeMatch) {
                timeText = `${timeMatch[1]}時${timeMatch[2]}分${timeMatch[3]}秒`;
            }

            const card = document.createElement('div');
            card.className = 'notification-card';
            card.textContent = `${timeText} ${name}さんが出席登録しました`;

            container.appendChild(card);

            setTimeout(() => {
                card.remove();
            }, 5000);
        }

        setInterval(checkNewAttendance, POLL_INTERVAL);
    </script>
</body>
</html>
