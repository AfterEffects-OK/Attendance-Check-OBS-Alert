<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出席通知オーバーレイ（薄い黄色・太字版）</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下寄せ */
            align-items: flex-start;    /* 左寄せ */
            box-sizing: border-box;
        }

        #notification-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .notification-card {
            /* 薄い黄色背景 ＆ 黒文字（シャドウ・エッジなし） */
            background: #ffdfdf;
            color: #111827;
            
            /* 上下のパディングを詰めたスリムな設計 */
            padding: 4px 20px;
            border-radius: 4px;
            
            /* シャドウやエッジは完全に排除し、アクセントの左線だけ残す */
            box-shadow: none;
            border-left: 8px solid #ca8a04;
            
            font-size: 42px;
            /* 文字が細く見えないよう、ウェイトを「900（極太）」に強化 */
            font-weight: 800;
            letter-spacing: 0.5px;
            
            opacity: 0;
            transform: translateY(20px);
            
            /* スムーズなGPU描画アニメーション */
            animation: slideUp 0.3s ease-out 30s forwards, fadeOut 0.3s ease-in 39.7s forwards;
            white-space: nowrap;
            will-change: opacity, transform;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div id="notification-container"></div>

    <script>
        // 設定済みのGASウェブアプリのURL
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPg8qswqVyNpWrL0gUX2DVh2uUJP6VUrk2VwqhSqn0rWjdci_KiYTBw4JFvLXQjU-8/exec';
        const POLL_INTERVAL = 3000; // 3秒ごとにチェック
        
        let lastRowCount = -1;
        let notificationQueue = [];
        let isProcessingQueue = false;
        
        async function checkNewAttendance() {
            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const data = await response.json();
        
                if (data && data.success) {
                    const currentRowCount = data.rowCount;
                    const recentRecords = data.recentRecords || [];
        
                    if (lastRowCount === -1) {
                        // 初回読み込み時は現在の行数を記録するのみ
                        lastRowCount = currentRowCount;
                    } else if (currentRowCount > lastRowCount) {
                        // 新しく増えた件数を計算
                        const addedCount = currentRowCount - lastRowCount;
                        lastRowCount = currentRowCount;
        
                        // 増えた件数分だけ末尾から取り出してキュー（追加待ちリスト）に追加
                        const newRecords = recentRecords.slice(-addedCount);
                        notificationQueue.push(...newRecords);
        
                        // キューの消化処理を開始
                        processQueue();
                    }
                }
            } catch (error) {
                console.error('出席データの取得に失敗しました:', error);
            }
        }
        
        // キューに入った通知を順番に処理する関数
        function processQueue() {
            if (isProcessingQueue || notificationQueue.length === 0) return;
        
            isProcessingQueue = true;
        
            // 先頭の1件を取り出して表示
            const record = notificationQueue.shift();
            if (record && record.time && record.name) {
                showNotification(record.time, record.name);
            }
        
            // 複数人連続で追加された場合、前の人の表示から少し間隔（例: 0.5秒）を空けて次の人を表示
            setTimeout(() => {
                isProcessingQueue = false;
                processQueue(); // 次の人の処理へ
            }, 500); // 次のカードを出すまでの間隔（500ms = 0.5秒）
        }

        function showNotification(timestampStr, name) {
            const container = document.getElementById('notification-container');

            let timeText = timestampStr;
            const timeMatch = timestampStr.match(/(\d{1,2}):(\d{2}):(\d{2})/);
            if (timeMatch) {
                timeText = `${timeMatch[1]}時${timeMatch[2]}分${timeMatch[3]}秒`;
            }

            const card = document.createElement('div');
            card.className = 'notification-card';
            card.textContent = `${timeText} ${name}さんが出席登録しました`;

            container.appendChild(card);

            setTimeout(() => {
                card.remove();
            }, 40000);
        }

        setInterval(checkNewAttendance, POLL_INTERVAL);
    </script>
</body>
</html>
